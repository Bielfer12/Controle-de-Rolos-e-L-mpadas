<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //CRIAÇÃO DE VARIAVEIS
        const nome_user = '';
        const idade = '';
        const tarefas = [];

        const limiteTarefas = 4;
        let i = 0
    
        //CRIAÇÃO DAS FUNÇÕES PRINCIPAIS
        //
        function saudarUsuario(nome,idade){
            console.log('Olá, '+nome_user+' voce tem '+idade+' anos');
        }

        function adicionarTarefa(descricao) {
            if (tarefas.length >= limiteTarefas){
            console.log('Voce atingiu o limite de tarefas')
            return;
        }

        //com o psuh esta adicionando as tarefas.
        tarefas.push({descricao ,status: false})
        console.log("Tarefa " + descricao + " adicionada com sucesso!");
        
        }

        function marcarComoCompleta(descricao) {
            //crianddo uma variavel que vai informar se tem certo nome pedido dentro do array
            let tarefa = tarefas.find(t => t.descricao === descricao )
            if (!tarefa){
                console.log('Tarefa não encontrada')
            return
        }

        tarefa.status = true;
        console.log(`Tarefa "${descricao}" marcada como completa!`);

        }

        function listarTarefas() {
            //com o forEach ele percorre todas as tarefas do array. Fazendo a considção que eu propus ele a fazer
            tarefas.forEach(tarefa => {
                //dai eu trago o console.log, com uma condição ternaria no js que é bem estranha na real. Opção ternaria pois se nao for aquilo vai ser aquele outro, uma opção mais rapida para dizer se é true ou false(obs:nao sei se fiz certo)
                console.log('Tarefa: ' + tarefas.descricao + '| Status: ' + tarefas.status != true ? 'Completa' : 'Imcompleta')
            })
        }

        function removerTarefa(descTarefa) {
            let acharExc = tarefas.find(t => t.descricao === descTarefa)
            if (!acharExc){
                console.log('Tarefa não encontrada')
            return
        }

        acharExc.Pop
        console.log('Foi apagado a tarefa: ' + descTarefa)

        }

        //Saudar
        saudarUsuario('Gabriel','19');
        
        //Adicionar
        adicionarTarefa('Js');
        adicionarTarefa('html');
        adicionarTarefa('css');
        adicionarTarefa('advpl');
        adicionarTarefa('advpl');
        
        //Marcar
        marcarComoCompleta('Js');
        
        //Listar
        listarTarefas('Js');
        
        //Remover
        removerTarefa('html')

        //listar tarefa pós remoção
        listarTarefas('Js')
        listarTarefas('css')
        listarTarefas('advpl')
        listarTarefas('html')

    </script>
</body>
</html>
